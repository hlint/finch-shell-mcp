name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --input-type=module -e "import {spawn} from 'node:child_process'; const child = spawn(process.execPath, ['dist/index.mjs'], {stdio:['pipe','inherit','inherit']}); child.stdin.end(); child.on('exit', (code) => process.exit(code ?? 1))"
